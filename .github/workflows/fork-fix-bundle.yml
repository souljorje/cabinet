name: Fork Fix Bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-validate-package:
    name: Apply, validate, and package fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply reviewed fixes
        run: |
          python3 scripts/apply-fork-review-fixes.py
          python3 scripts/apply-fork-review-test-adjustments.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Check fork invariants
        run: npm run fork:check

      - name: Lint
        run: npm run lint -- --quiet

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm test > unit-test.log 2>&1

      - name: Upload unit test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fork-fix-unit-test-log
          path: unit-test.log
          if-no-files-found: error
          retention-days: 2

      - name: Require unit tests
        if: ${{ steps.unit.outcome != 'success' }}
        run: |
          tail -n 80 unit-test.log
          exit 1

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fork-fix-build-log
          path: build.log
          if-no-files-found: error
          retention-days: 2

      - name: Require build
        if: ${{ steps.build.outcome != 'success' }}
        run: |
          tail -n 100 build.log
          exit 1

      - name: Verify generated diff
        id: diffcheck
        continue-on-error: true
        run: git diff --check > diff-check.log 2>&1

      - name: Upload diff diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fork-fix-diff-check-log
          path: diff-check.log
          if-no-files-found: error
          retention-days: 2

      - name: Require clean diff
        if: ${{ steps.diffcheck.outcome != 'success' }}
        run: |
          cat diff-check.log
          exit 1

      - name: Create source archive
        run: |
          rm -rf .next node_modules out unit-test.log build.log diff-check.log
          zip -qr cabinet-fixed.zip . \
            -x '.git/*' \
            -x 'cabinet-fixed.zip'

      - name: Upload fixed source
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-fixed-source
          path: cabinet-fixed.zip
          if-no-files-found: error
          retention-days: 7
